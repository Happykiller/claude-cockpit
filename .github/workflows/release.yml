# A tag vX.Y.Z publishes the release: the GitHub Release the cockpit checks
# for, with that version's CHANGELOG.md section as its notes.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag, the manifest, the module and the changelog agree
        run: |
          scripts/check-version.sh
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, plugin.json $version"
            exit 1
          fi

      - name: Notes from CHANGELOG.md
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Cockpit $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
